interface:

  display_name: "真实素材新闻视频"

  short_description: "用真实素材制作中英文竖版视频，并输出视频号、抖音、小红书标题文案与核查话题"
  default_prompt: "请使用 $evidence-news-video，根据我的主题制作约2分钟1080p竖版中文版；配音前逐句去重、删废话、合并并按口播顺序通读，不为时长增加空话；封面按题材选择体育、生活消费、科技或娱乐公开事件模板；上方标题完整留在标题区，按真实字体边界与画面留足间距；作者署名读取当前用户配置；沿用满意版配色，接入用户提供或包外准备的旁白，按一条作品一个文件夹交付1080p成片、封面、字幕、纯旁白、来源说明和三平台发布包，并直接用1080p成片供确认。"
